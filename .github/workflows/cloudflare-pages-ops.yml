name: Cloudflare Pages Operations

on:
  push:
    branches:
      - production-paypal-live-20261028
    paths:
      - .github/workflows/cloudflare-pages-ops.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the project or retry the newest failed deployment
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - retry_latest_failed
      confirm_retry:
        description: Must be true to submit a retry request
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-ops
  cancel-in-progress: false

jobs:
  pages-ops:
    name: Protected Cloudflare Pages operation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: cloudflare-write
    env:
      CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_WRITE_TOKEN }}
      CF_ACCOUNT_ID: "cb35584737ab3f7fa4ceafc3d19214ab"
      CF_PROJECT_NAME: "autoops-hub"
      OPERATION: ${{ inputs.operation || 'inspect' }}
      CONFIRM_RETRY: ${{ inputs.confirm_retry || false }}
    steps:
      - name: Verify write credential, inspect connection and diagnose latest failed build
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CF_READ_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${CF_WRITE_TOKEN}" ]]; then
            echo "::warning::Environment secret CLOUDFLARE_PAGES_WRITE_TOKEN is unavailable. Inspection can continue, but write operations will remain disabled."
          fi

          api_request() {
            local method="$1"
            local endpoint="$2"
            local payload="${3:-}"
            local auth_token="${4:-${CF_READ_TOKEN}}"
            local response http_code body
            local -a args
            args=(--silent --show-error --connect-timeout 15 --max-time 60
              --request "${method}"
              --header "Authorization: Bearer ${auth_token}"
              --header "Accept: application/json")
            if [[ -n "${payload}" ]]; then
              args+=(--header "Content-Type: application/json" --data "${payload}")
            fi
            if ! response="$(curl "${args[@]}" --write-out '|%{http_code}' "https://api.cloudflare.com/client/v4${endpoint}")"; then
              echo "::error::Cloudflare request failed for ${method} ${endpoint}." >&2
              return 1
            fi
            http_code="${response##*|}"
            body="${response%|*}"
            if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Cloudflare API returned HTTP ${http_code} for ${method} ${endpoint}." >&2
              jq -r '.errors[]?.message // empty' <<< "${body}" >&2 || true
              return 1
            fi
            if ! jq -e '.success == true' <<< "${body}" >/dev/null; then
              echo "::error::Cloudflare API did not report success for ${method} ${endpoint}." >&2
              jq -r '.errors[]?.message // empty' <<< "${body}" >&2 || true
              return 1
            fi
            printf '%s' "${body}"
          }

          echo "## Cloudflare Pages protected operations" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Project: ${CF_PROJECT_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Requested operation: ${OPERATION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Read token: present (value withheld)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Write token: ${CF_WRITE_TOKEN:+present (value withheld)}" >> "${GITHUB_STEP_SUMMARY}"

          if [[ -n "${CF_WRITE_TOKEN}" ]]; then
            echo "Verifying Cloudflare write token..."
            token_json="$(api_request GET "/user/tokens/verify" "" "${CF_WRITE_TOKEN}")"
            token_status="$(jq -r '.result.status // "unknown"' <<< "${token_json}")"
            echo "- Write token status: ${token_status}" | tee -a "${GITHUB_STEP_SUMMARY}"
            if [[ "${token_status}" != "active" ]]; then
              echo "::error::Cloudflare write token is not active."
              exit 1
            fi

            if api_request GET "/accounts/${CF_ACCOUNT_ID}/pages/projects" "" "${CF_WRITE_TOKEN}" >/dev/null 2>&1; then
              write_scope_status="accepted"
            else
              write_scope_status="rejected"
            fi
          else
            write_scope_status="missing"
          fi
          echo "- Write token Pages API scope check: ${write_scope_status}" | tee -a "${GITHUB_STEP_SUMMARY}"

          echo "Reading Pages project list with the read-only token..."
          projects_json="$(api_request GET "/accounts/${CF_ACCOUNT_ID}/pages/projects")"
          project_json="$(jq -c --arg name "${CF_PROJECT_NAME}" '.result[]? | select(.name == $name)' <<< "${projects_json}")"
          if [[ -z "${project_json}" ]]; then
            echo "::error::The Pages API did not return the expected project from the account project list. Check account scope and the project name."
            exit 1
          fi
          result_type="$(jq -r 'type' <<< "${project_json}")"
          result_keys="$(jq -r 'if type == "object" then (keys | join(",")) else "result is not an object" end' <<< "${project_json}")"
          project_source="$(jq -r 'try (.source.type // "unknown") catch "unknown"' <<< "${project_json}")"
          connected_owner="$(jq -r 'try (.source.config.owner // "") catch ""' <<< "${project_json}")"
          connected_repo="$(jq -r 'try (.source.config.repo_name // "") catch ""' <<< "${project_json}")"
          configured_branch="$(jq -r 'try (.production_branch // "unknown") catch "unknown"' <<< "${project_json}")"
          build_command="$(jq -r 'try (.build_config.build_command // "(not set)") catch "(not reported)"' <<< "${project_json}")"
          build_output="$(jq -r 'try (.build_config.destination_dir // "(not set)") catch "(not reported)"' <<< "${project_json}")"
          root_directory="$(jq -r 'try (.build_config.root_dir // "(not set)") catch "(not reported)"' <<< "${project_json}")"
          production_enabled="$(jq -r 'try (.production_deployments_enabled // "unknown") catch "unknown"' <<< "${project_json}")"

          {
            echo ""
            echo "### Pages project configuration"
            echo "- Project result type: ${result_type}"
            echo "- Available project fields: ${result_keys}"
            echo "- Source provider: ${project_source}"
            echo "- Connected repository: ${connected_owner:-not returned}/${connected_repo:-not returned}"
            echo "- Production branch: ${configured_branch}"
            echo "- Production auto-deploys enabled: ${production_enabled}"
            echo "- Build command: ${build_command}"
            echo "- Output directory: ${build_output}"
            echo "- Root directory: ${root_directory}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Pages project metadata::result=${result_type}; keys=${result_keys}; source=${project_source}; repo=${connected_owner:-unknown}/${connected_repo:-unknown}; branch=${configured_branch}"

          if [[ "${project_source}" != "unknown" && "${project_source}" != "github" ]]; then
            echo "::error::Cloudflare Pages reports a non-GitHub source provider. No retry or configuration change will be attempted."
            exit 1
          fi
          if [[ -n "${connected_owner}" && "${connected_owner}" != "imaraonecbo" ]]; then
            echo "::error::Cloudflare Pages is connected to a different GitHub owner. No retry or configuration change will be attempted."
            exit 1
          fi
          if [[ -n "${connected_repo}" && "${connected_repo}" != "autoops-hub" ]]; then
            echo "::error::Cloudflare Pages is connected to a different repository. No retry or configuration change will be attempted."
            exit 1
          fi
          if [[ "${configured_branch}" != "unknown" && "${configured_branch}" != "production-paypal-live-20261028" ]]; then
            echo "::error::Cloudflare Pages production branch differs from the approved production branch. No change will be made automatically."
            exit 1
          fi

          echo "Reading the ten most recent production deployments..."
          deployments_json="$(api_request GET "/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=production&page=1&per_page=10")"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Recent production deployments" >> "${GITHUB_STEP_SUMMARY}"
          jq -r '.result[]? | "- " + (.short_id // .id // "unknown") + " | " + (.latest_stage.name // "unknown") + ": " + (.latest_stage.status // "unknown") + " | " + (.modified_on // "unknown") + " | " + (.url // "no URL")' <<< "${deployments_json}" | tee -a "${GITHUB_STEP_SUMMARY}"

          failed_json="$(jq -c '[.result[]? | select(.latest_stage.status == "failure")][0] // empty' <<< "${deployments_json}")"
          failed_id="$(jq -r '.id // empty' <<< "${failed_json}")"

          if [[ -z "${failed_id}" ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "No failed production deployment was found in the latest ten results." | tee -a "${GITHUB_STEP_SUMMARY}"
            if [[ "${OPERATION}" == "retry_latest_failed" ]]; then
              echo "::error::There is no failed deployment to retry."
              exit 1
            fi
            exit 0
          fi

          failed_short_id="$(jq -r '.short_id // .id' <<< "${failed_json}")"
          failed_stage="$(jq -r '.latest_stage.name // "unknown"' <<< "${failed_json}")"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Latest failed deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Deployment: ${failed_short_id}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- Failed stage: ${failed_stage}" | tee -a "${GITHUB_STEP_SUMMARY}"

          echo "Retrieving detailed deployment history logs..."
          logs_json="$(api_request GET "/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${failed_id}/history/logs")"
          total_logs="$(jq -r '.result.total // (.result.data | length) // 0' <<< "${logs_json}")"
          echo "- Log entries available: ${total_logs}" | tee -a "${GITHUB_STEP_SUMMARY}"

          log_text="$(jq -r '[.result.data[]?.line // empty] | join("\\n")' <<< "${logs_json}")"
          classify() {
            local regex="$1"
            if grep -Eqi "${regex}" <<< "${log_text}"; then printf 'detected'; else printf 'not detected'; fi
          }
          {
            echo "- GitHub App disconnected: $(classify 'disconnected from your git account|not properly installed')"
            echo "- GitHub App suspended: $(classify 'installation.*suspended|suspended.*installation')"
            echo "- Repository access denied: $(classify 'repository cannot be accessed|repository not found|authentication failed|permission denied|access denied|http 403|could not read from remote')"
            echo "- Git LFS issue: $(classify 'git lfs|large file storage|lfs smudge|filter-process')"
            echo "- Submodule issue: $(classify 'submodule|\.gitmodules')"
            echo "- Network or DNS issue: $(classify 'could not resolve host|connection timed out|connection refused|network is unreachable')"
            echo "- Cloudflare SCM internal issue: $(classify 'internal issue.*git installation|internal error.*scm')"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Sanitized matching log excerpts" >> "${GITHUB_STEP_SUMMARY}"
          matching_lines="$(jq -r '[.result.data[]?.line // empty | select(test("error|fatal|failed|denied|repository|clone|git|lfs|submodule|suspend|install|remote"; "i"))] | unique | .[-10:][]' <<< "${logs_json}" | sed -E 's#https?://[^/@ ]+:[^/@ ]+@#https://[REDACTED]@#g; s/(Bearer|token|password|secret)[=: ]+[^ ]+/\1=[REDACTED]/Ig; s/gh[pousr]_[A-Za-z0-9_]+/[REDACTED]/g')"
          if [[ -n "${matching_lines}" ]]; then
            while IFS= read -r line; do
              echo "- ${line}" | tee -a "${GITHUB_STEP_SUMMARY}"
            done <<< "${matching_lines}"
          else
            echo "No matching error lines were returned by Cloudflare." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
          echo "- Full raw logs are not copied to the public Actions summary." >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${OPERATION}" == "retry_latest_failed" ]]; then
            if [[ "${CONFIRM_RETRY}" != "true" ]]; then
              echo "::error::Retry was requested without confirm_retry=true. No deployment action was taken."
              exit 1
            fi
            echo "Submitting an explicit retry for failed deployment ${failed_short_id}..."
            if [[ "${write_scope_status}" != "accepted" ]]; then
              echo "::error::The write token did not pass the Pages API account-scope check. No retry request was submitted."
              exit 1
            fi
            retry_json="$(api_request POST "/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${failed_id}/retry" '{}' "${CF_WRITE_TOKEN}")"
            retry_id="$(jq -r '.result.id // empty' <<< "${retry_json}")"
            retry_url="$(jq -r '.result.url // empty' <<< "${retry_json}")"
            {
              echo ""
              echo "### Retry request accepted"
              echo "- New deployment ID: ${retry_id:-not returned}"
              echo "- Deployment URL: ${retry_url:-not returned}"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo ""
            echo "Inspection completed. No Pages settings or deployments were changed."
          fi

          echo ""
          echo "## Safe diagnostic summary"
          cat "${GITHUB_STEP_SUMMARY}"
