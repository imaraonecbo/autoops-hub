name: Customer journey and payment safety tests
on:
  push:
    branches:
      - production-paypal-live-20261028
    paths:
      - "backend/**"
      - "tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/customer-journey-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/customer-journey-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit and payment security tests
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          PAYPAL_CLIENT_ID: ""
          PAYPAL_CLIENT_SECRET: ""
          PAYPAL_WEBHOOK_ID: ""
        run: python -m unittest discover -s tests -v
