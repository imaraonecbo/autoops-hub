name: Production public webhook smoke

on:
  push:
    branches:
      - validation-autoops-live-check-20261028

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health and print safe readiness flags
        run: |
          set -euo pipefail
          base="https://autoops-hub-production.onrender.com"
          code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error --retry 3 --retry-delay 5 --output health.json --write-out '%{http_code}' "$base/api/v1/health")
          echo "Health HTTP status: $code"
          test "$code" = "200"
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path("health.json").read_text())
          safe={
            "status":h.get("status"),
            "database_configured":h.get("database_configured"),
            "database_reachable":h.get("database_reachable"),
            "payment_mode":h.get("payment_mode"),
            "paypal_live_enabled":h.get("paypal_live_enabled"),
            "paypal_credentials_configured":h.get("paypal_credentials_configured"),
            "paypal_credential_checks":h.get("paypal_credential_checks"),
            "paypal_checkout_enabled":h.get("paypal_checkout_enabled"),
          }
          print(json.dumps(safe,sort_keys=True))
          if h.get("status") != "ok" or h.get("database_reachable") is not True:
            raise SystemExit("Health or database connectivity failed.")
          PY
      - name: Verify unsigned webhook is rejected
        run: |
          set -euo pipefail
          base="https://autoops-hub-production.onrender.com"
          code=$(curl --connect-timeout 10 --max-time 45 --silent --show-error --output webhook.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"id":"AUTOOPS-UNSIGNED-RUNTIME-CHECK","event_type":"PAYMENT.CAPTURE.COMPLETED","resource":{}}' "$base/api/v1/payments/paypal-webhook")
          echo "Unsigned webhook HTTP status: $code"
          cat webhook.json
          test "$code" = "401"
          echo "PASS: production rejected an unsigned webhook."
